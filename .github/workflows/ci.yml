name: CI Pipeline

on:
  push:
    branches:
      - main
      - member1-form-feature

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Run HTML Test
        run: htmlhint form.html
